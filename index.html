<!DOCTYPE html>
<html>
<head>
    <title>Road Accident Severity Prediction</title>
</head>
<body>

<h2>AI-Powered Road Accident Severity Prediction</h2>

<form action="/predict" method="post">

    <label>Vehicle Speed:</label>
    <input type="number" name="speed" required><br><br>

    <label>Weather:</label>
    <select name="weather">
        <option value="0">Clear</option>
        <option value="1">Rainy</option>
        <option value="2">Foggy</option>
    </select><br><br>

    <label>Traffic Density:</label>
    <input type="number" name="traffic" required><br><br>

    <button type="submit">Predict</button>

</form>

<h3>{{ prediction_text }}</h3>

</body>
</html>
