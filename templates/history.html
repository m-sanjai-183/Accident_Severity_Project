
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accident Prediction History</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">

        <a href="/">
            <i class="fas fa-home"></i> Home
        </a>

        <a href="/dashboard">
            <i class="fas fa-chart-bar"></i> Dashboard
        </a>

        <a href="/history" class="active">
            <i class="fas fa-history"></i> History
        </a>

    </nav>

    <div class="container">

        <h1>Accident Prediction History</h1>

        <table>

            <tr>
                <th>ID</th>
                <th>Speed</th>
                <th>Weather</th>
                <th>Road Condition</th>
                <th>Vehicles</th>
                <th>Severity</th>
            </tr>

            {% for row in records %}
            <tr>
                <td>{{ row[0] }}</td>
                <td>{{ row[1] }}</td>
                <td>{{ row[2] }}</td>
                <td>{{ row[3] }}</td>
                <td>{{ row[4] }}</td>
                <td>{{ row[5] }}</td>
            </tr>
            {% endfor %}

        </table>

    </div>

</body>
</html>
